{% extends "base.html" %}

{% block title %}Log In - Viraya Company's Interview AI Bot{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="width: 56px; height: 56px; background: var(--primary); color: white; border-radius: var(--radius-md); font-weight: 800; font-size: 1.75rem; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem; box-shadow: var(--shadow-md);">
      V
    </div>
    <h1 style="font-size: 1.85rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.35rem;">
      Welcome Back
    </h1>
    <p style="color: var(--text-secondary); font-size: 0.925rem;">
      Viraya Company's Interview AI Bot. Log in to manage candidates, live sessions, and reports.
    </p>
  </div>

  <div class="card" style="box-shadow: var(--shadow-lg); padding: 2rem;">
    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="next" value="{{ next or '' }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-input" 
          placeholder="e.g. recruiter@viraya.com" 
          value="{{ email or '' }}" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="Enter your password" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.75rem; justify-content: center; font-weight: 600;">
        Log In
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
      Don't have an account yet? 
      <a href="{{ url_for('auth.signup') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
        Create Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
